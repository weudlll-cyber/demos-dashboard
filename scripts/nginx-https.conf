# nginx-https.conf — DEMOS Dashboard: HTTPS server block template
# ============================================================
# This file is appended to the nginx config by scripts/install.sh
# immediately after certbot obtains a Let's Encrypt certificate.
# It is also used by scripts/https-activate.sh for manual HTTPS setup.
#
# Placeholders replaced at install time:
#   __DOMAIN__    → your actual domain (e.g. demo.example.com)
#   __WEB_ROOT__  → web root path     (e.g. /var/www/demos-dashboard)
#
# After initial activation the HSTS max-age is 300 seconds (5 minutes).
# Once you have confirmed HTTPS is stable, increase it to 31536000 (1 year):
#   sudo sed -i 's/max-age=300/max-age=31536000/' /etc/nginx/sites-available/demos-dashboard
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # ---- TLS — certificate managed by certbot, do not edit manually ----
    # Certbot places renewed certificates in /etc/letsencrypt/live/__DOMAIN__/
    # and the systemd timer (certbot.timer) renews them automatically.
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  __WEB_ROOT__;
    index index.html;

    # ---- /info reverse proxy ----
    # Identical to the HTTP server block.
    # CRITICAL: this location must come BEFORE the catch-all / block,
    # otherwise the SPA fallback returns index.html for /info requests
    # and the dashboard always shows "Cannot reach node".
    location /info {
        limit_req zone=api_zone burst=5 nodelay;

        proxy_pass http://127.0.0.1:53550;

        # Tell the node we are coming from localhost (not from the client IP).
        proxy_set_header Host localhost;

        # Do NOT forward the real client IP — reduces privacy leakage.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";

        # Match the 5-second AbortSignal.timeout() in src/api.js.
        proxy_connect_timeout 5s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;

        # Never cache API responses — the dashboard needs live node data.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Single-page app fallback ----
    # All other requests go to index.html so Svelte client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- HSTS — HTTP Strict Transport Security ----
    # Tells browsers to ONLY connect via HTTPS from now on.
    # max-age=300 (5 min) during initial rollout; raise to 31536000 once stable.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    # ---- Content-Security-Policy ----
    # Strict allowlist: only resources from 'self' are permitted.
    # 'data:' on img-src is required for the SVG data-URI favicon in index.html.
    # connect-src 'self' covers the /api fetch in src/api.js.
    add_header Content-Security-Policy
        "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
        always;

    # ---- Permissions-Policy ----
    # Explicitly disable every browser hardware/sensor API. This dashboard
    # uses none of them — disabling them prevents accidental future access.
    add_header Permissions-Policy
        "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), cross-origin-isolated=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), web-share=(), xr-spatial-tracking=()"
        always;

    # ---- Prevent MIME-sniffing ----
    add_header X-Content-Type-Options "nosniff" always;

    # ---- Legacy clickjacking protection (redundant with CSP frame-ancestors) ----
    add_header X-Frame-Options "DENY" always;

    # ---- Referrer leakage control ----
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Cross-domain policy ----
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;
    gzip_min_length 256;

    # ---- Static asset caching ----
    # Vite hashes filenames so assets can be cached aggressively.
    # All security headers are re-declared here: nginx add_header directives
    # in nested location blocks do NOT inherit from the parent server block.
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";

        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        add_header Content-Security-Policy
            "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
            always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy
            "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()"
            always;
        access_log off;
    }

    access_log /var/log/nginx/demos-dashboard.access.log;
    error_log  /var/log/nginx/demos-dashboard.error.log;
}
