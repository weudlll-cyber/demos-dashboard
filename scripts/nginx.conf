# nginx.conf — DEMOS Node Dashboard
# ============================================================
# Template used by scripts/install.sh
# __WEB_ROOT__ is replaced by the actual path during installation.
#
# After manual edits, test with:   sudo nginx -t
# Then reload with:                sudo systemctl reload nginx
#
# Security posture:
#   - server_tokens off       hides nginx version from attackers
#   - Content-Security-Policy blocks XSS, clickjacking, and data injection
#   - Referrer-Policy         limits information leakage to third parties
#   - Permissions-Policy      disables all browser sensor/hardware APIs
#   - X-Frame-Options         legacy clickjacking protection (CSP covers this too)
#   - X-Content-Type-Options  prevents MIME-sniffing attacks
#   - HSTS header             (commented out — uncomment after HTTPS is enabled)
#   - No version banners in headers or error pages
# ============================================================

# Hide the nginx version number in Server header and error pages.
# Reduces information available to automated scanners.
server_tokens off;

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain once DNS is configured.
    # Example: server_name demo.example.com;
    server_name _;

    root __WEB_ROOT__;
    index index.html;

    # ---- Single-page app fallback ----
    # All routes fall back to index.html so Svelte routing works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Content-Security-Policy ----
    # Strict allowlist — only 'self' for all resource types.
    # 'data:' on img-src is required by the SVG data-URI favicon in index.html.
    # connect-src 'self' covers the /api fetch made by api.js.
    # This policy prevents XSS, data injection, and clickjacking.
    # If you ever add external fonts (e.g. Google Fonts) you MUST add the
    # origin to font-src and style-src before deploying.
    add_header Content-Security-Policy
        "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
        always;

    # ---- Strict-Transport-Security (HSTS) ----
    # Uncomment AFTER obtaining an HTTPS certificate with certbot.
    # Setting HSTS on plain HTTP has no security effect and can cause
    # issues during HTTPS rollout.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ---- Permissions-Policy ----
    # Explicitly disable every browser sensor and hardware API.
    # This dashboard does not need any of these — disabling them reduces
    # the attack surface if a future dependency tries to access them.
    add_header Permissions-Policy
        "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), cross-origin-isolated=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), navigation-override=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()"
        always;

    # ---- Prevent MIME-sniffing ----
    # Forces the browser to respect the declared Content-Type and not
    # guess the type from the file contents (mitigates drive-by downloads).
    add_header X-Content-Type-Options "nosniff" always;

    # ---- Legacy clickjacking protection ----
    # Redundant with 'frame-ancestors none' in CSP above, but kept for
    # older browsers and WAF rules that inspect this header.
    add_header X-Frame-Options "DENY" always;

    # ---- Referrer leakage control ----
    # Only sends origin (no path) when navigating cross-origin, and only
    # on same-protocol (HTTPS-to-HTTPS or HTTP-to-HTTP) transitions.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Cross-domain policy ----
    # Prevents Flash and PDF plugins from making cross-domain requests.
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ---- XSS protection (legacy) ----
    # The 1; mode=block mode is deprecated and removed in modern browsers.
    # CSP renders this header unnecessary — NOT included here to avoid the
    # known bypass issues in older IE versions.

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;
    gzip_min_length 256;

    # ---- Static asset caching ----
    # Vite hashes asset filenames, so these can be cached aggressively.
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Re-declare security headers here — nginx add_header in a nested
        # location block does NOT inherit parent add_header directives.
        add_header Content-Security-Policy
            "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
            always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
        access_log off;
    }

    # ---- Logging ----
    access_log /var/log/nginx/demos-dashboard.access.log;
    error_log  /var/log/nginx/demos-dashboard.error.log;
}

