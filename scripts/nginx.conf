# nginx.conf — DEMOS Node Dashboard
# ============================================================
# Template used by scripts/install.sh
# __WEB_ROOT__ is replaced by the actual path during installation.
#
# After manual edits, test with:   sudo nginx -t
# Then reload with:                sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain once DNS is configured.
    # Example: server_name demo.example.com;
    server_name _;

    root __WEB_ROOT__;
    index index.html;

    # ---- Single-page app fallback ----
    # All routes fall back to index.html so Svelte's routing works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security headers ----
    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "1; mode=block"                 always;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;
    gzip_min_length 256;

    # ---- Static asset caching ----
    # Vite hashes asset filenames, so these can be cached aggressively.
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Logging ----
    access_log /var/log/nginx/demos-dashboard.access.log;
    error_log  /var/log/nginx/demos-dashboard.error.log;
}
