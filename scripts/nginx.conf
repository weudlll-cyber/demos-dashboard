# nginx.conf — DEMOS Node Dashboard
# ============================================================
# Template used by scripts/install.sh
# __WEB_ROOT__ is replaced by the actual path during installation.
#
# After manual edits, test with:   sudo nginx -t
# Then reload with:                sudo systemctl reload nginx
#
# Security posture:
#   - server_tokens off         hides nginx version from attackers
#   - Rate limiting zone        caps /api calls to prevent node hammering
#   - Content-Security-Policy   blocks XSS, clickjacking, and data injection
#   - Permissions-Policy        disables all browser sensor/hardware APIs
#   - X-Frame-Options           legacy clickjacking protection
#   - X-Content-Type-Options    prevents MIME-sniffing attacks
#   - Referrer-Policy           limits information leakage to third parties
#   - /api reverse proxy        forwards to localhost:53550 (never exposed directly)
#   - HSTS + HTTP redirect      template (uncomment after HTTPS is enabled)
#   - No version banners in headers or error pages
# ============================================================

# Hide the nginx version number in Server header and error pages.
server_tokens off;

# ---- Rate limiting ----
# Defines a shared-memory zone (10 MB ≈ 160,000 IP addresses).
# Limit: 20 requests per minute per IP address for the /api proxy.
# A legitimately running 3-second polling dashboard needs ~20 req/min.
# This also protects the DEMOS node from being hammered by external IPs.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/m;

# ============================================================
# HTTP server — serves dashboard and proxies /api to DEMOS node
# ============================================================
server {
    listen 80;
    listen [::]:80;

    # Placeholder replaced by scripts/install.sh — do not edit this line manually.
    # To change the domain later: sudo nano /etc/nginx/sites-available/demos-dashboard
    server_name __DOMAIN__;

    root __WEB_ROOT__;
    index index.html;

    # ---- HTTPS redirect (activate after certbot + HTTPS confirmed working) ----
    # Once the HTTPS server block is confirmed working, uncomment the line below
    # and remove/comment out the root, location, and header directives in this
    # block — they become unreachable once the redirect is active.
    # return 301 https://$host$request_uri;

    # ---- certbot ACME challenge (keep even after redirect is active) ----
    # certbot writes renewed certificates by serving a challenge token here.
    # This location must remain reachable on port 80 at all times.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ---- /info reverse proxy ----
    # CRITICAL: This location must come BEFORE the catch-all / block.
    # Without this, the SPA fallback returns index.html for /info requests,
    # which fetchNodeData() silently fails to parse as JSON.
    #
    # Security:
    #   - Proxies only to 127.0.0.1 (loopback) — the DEMOS node must never
    #     be bound to 0.0.0.0 or exposed directly to the internet.
    #   - The real client IP is NOT forwarded (privacy protection).
    #   - API responses are never cached (always fresh node state).
    #   - Rate limited to 20 req/min per IP; burst of 5 absorbed without delay.
    location /info {
        limit_req zone=api_zone burst=5 nodelay;

        proxy_pass http://127.0.0.1:53550;

        # Tell the DEMOS node we're coming from localhost.
        proxy_set_header Host localhost;

        # Do NOT forward the real client IP — no need, and leaking
        # visitor IPs to the node reduces the privacy surface.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";

        # Match the 5-second AbortSignal.timeout() set in src/api.js.
        proxy_connect_timeout 5s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;

        # Never cache API responses — the dashboard needs live data.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Single-page app fallback ----
    # All non-API routes fall back to index.html so Svelte routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Content-Security-Policy ----
    # Strict allowlist — only 'self' for all resource types.
    # 'data:' on img-src is required by the SVG data-URI favicon in index.html.
    # connect-src 'self' covers the /info fetch made by api.js.
    # If you ever add external fonts (e.g. Google Fonts) you MUST extend
    # font-src and style-src before deploying.
    add_header Content-Security-Policy
        "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
        always;

    # ---- Strict-Transport-Security (HSTS) ----
    # Uncomment AFTER obtaining an HTTPS certificate with certbot.
    # Using HSTS on plain HTTP has no security effect and can block
    # your own access during HTTPS rollout.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ---- Permissions-Policy ----
    # Explicitly disable every browser sensor and hardware API.
    add_header Permissions-Policy
        "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), cross-origin-isolated=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), navigation-override=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()"
        always;

    # ---- Prevent MIME-sniffing ----
    add_header X-Content-Type-Options "nosniff" always;

    # ---- Legacy clickjacking protection ----
    # Redundant with 'frame-ancestors none' in CSP, but kept for older browsers.
    add_header X-Frame-Options "DENY" always;

    # ---- Referrer leakage control ----
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Cross-domain policy ----
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;
    gzip_min_length 256;

    # ---- Static asset caching ----
    # Vite hashes asset filenames so they can be cached aggressively.
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Re-declare security headers in this nested block.
        # nginx add_header does NOT inherit from the parent server block
        # when a nested location also uses add_header.
        add_header Content-Security-Policy
            "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
            always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
        access_log off;
    }

    # ---- Logging ----
    access_log /var/log/nginx/demos-dashboard.access.log;
    error_log  /var/log/nginx/demos-dashboard.error.log;
}

# ============================================================
# HTTPS server block
# ============================================================
# The HTTPS server block is stored in scripts/nginx-https.conf.
# scripts/install.sh appends it here automatically after certbot
# obtains a certificate.
#
# To set up HTTPS manually:
#   sudo certbot certonly --webroot -w /var/www/html -d YOUR_DOMAIN \
#        --email YOUR_EMAIL --agree-tos
#   Then: bash scripts/https-activate.sh
# ============================================================

