# =============================================================================
# ci.yml — DEMOS Node Dashboard: Continuous Integration Pipeline
# =============================================================================
#
# Triggered on: every push to main, every pull-request targeting main.
#
# Jobs (run in parallel where lint/test/security/secrets allow):
#
#   secrets      Scans every commit for accidentally committed secrets,
#                API keys, tokens, or credentials using gitleaks.
#
#   lint         Source health check (ESLint incl. security plugin).
#                Catches unused vars, undefined refs, eval(), ReDoS, etc.
#
#   test         Runs the full Vitest suite (unit + component tests).
#
#   security     npm audit --audit-level=high + audit-ci with allowlist.
#                Fails on any NEW high or critical dependency vuln.
#                Known accepted moderate dev-only issues documented in
#                audit-ci.json and SECURITY.md.
#
#   build        Production bundle (vite build).
#                Only runs after ALL four checks above pass.
#                Uploads dist/ artifact (7-day retention).
#
# Permissions:
#   Workflow-level: read-all (minimal by default, principle of least privilege).
#   Per-job overrides grant only what each job actually needs.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict all jobs to read-only by default.
# Individual jobs override only what they need.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Secrets scanning — detect credentials in git history
  # ---------------------------------------------------------------------------
  secrets:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history for secret scanning)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Fetch full git history so gitleaks can scan all commits,
          # not just the latest one.
          fetch-depth: 0

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # GITHUB_TOKEN is required by the action to post PR annotations.
          # 'contents: read' is sufficient — we don't write to the repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # JOB 2: Lint — ESLint with security plugin
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ESLint + security plugin)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (includes eslint-plugin-security)
        # --max-warnings 0: any warning is treated as an error.
        # Covers: undefined vars, eval(), ReDoS, prototype injection, etc.
        run: npx eslint src --ext .js,.svelte --max-warnings 0

  # ---------------------------------------------------------------------------
  # JOB 3: Test — unit + component tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # JOB 4: Security — dependency vulnerability audit
  # ---------------------------------------------------------------------------
  security:
    name: Security (npm audit + audit-ci)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on HIGH or CRITICAL)
        # Previously set to --critical because of the now-fixed happy-dom
        # critical CVE (GHSA-96g7). Back to --high now that no criticals remain.
        # Any new HIGH or CRITICAL vuln will break this step immediately.
        run: npm audit --audit-level=high

      - name: Run audit-ci (with documented allowlist)
        # audit-ci reads audit-ci.json which explicitly allowlists the known
        # MODERATE dev-only findings (esbuild dev server, Svelte SSR) with
        # full justification in SECURITY.md.
        # Any finding NOT in the allowlist at HIGH or CRITICAL will fail.
        run: npx audit-ci --config audit-ci.json

  # ---------------------------------------------------------------------------
  # JOB 5: Build — production bundle (runs only after ALL checks pass)
  # ---------------------------------------------------------------------------
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Gate: all four checks must pass before we produce a build artifact.
    needs: [secrets, lint, test, security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Report bundle sizes
        # Prints every file in dist/ sorted by size.
        # Makes bundle regressions visible immediately in the workflow log.
        run: du -sh dist/* dist/assets/* 2>/dev/null | sort -h || true

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          # 7-day retention: long enough for a manual deploy after a release.
          retention-days: 7

