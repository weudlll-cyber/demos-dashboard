# Dependabot configuration for DEMOS Node Dashboard
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # ---- npm dependencies ----
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    # Maximum number of open pull requests for npm updates
    open-pull-requests-limit: 5
    # Ignore major version bumps — they require manual migration (e.g. Svelte 4→5, ESLint 9→10)
    # and would fail CI with breaking changes. Review major upgrades manually.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Group all non-breaking updates into a single PR to reduce noise
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Automatically add a reviewer and label for easy triage
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps):"

  # ---- GitHub Actions ----
  # Keeps CI action versions current (important for supply-chain security)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(actions):"
